<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANPRO - Software Manajemen Proyek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f71a1a;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            overflow: hidden;
        }
        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.8s ease-in-out;
        }
        .splash-logo {
            width: 100%;
            max-height: 90vh; /* Logo dibuat sangat besar mengisi layar */
            object-fit: contain;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.06));
            margin-bottom: 25px;
        }
        .progress-container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            margin-bottom: 10px;
        }
        .progress {
            height: 10px;
            border-radius: 6px;
            background-color: #e9ecef;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, #0d6efd, #0dcaf0);
            width: 0%;
            transition: width 10s linear;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div></div> <!-- Spacer atas -->
    
    <div class="splash-container">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="MANPRO Logo" class="splash-logo">
    </div>

    <div class="progress-container">
        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <p class="text-secondary small mt-2 mb-0" style="font-size: 0.75rem;">Memuat sistem...</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('progressBar').style.width = '100%';
            }, 100);

            setTimeout(() => {
                window.location.href = "{{ url_for('login') }}";
            }, 6000);
        });
    </script>
</body>
</html>
