<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang - MANPRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #c90805 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .welcome-card {
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 550px;
            width: 90%;
            animation: slideUp 0.8s ease-in-out;
        }
        .icon-box {
            width: 70px;
            height: 70px;
            background: rgba(13, 110, 253, 0.1);
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px auto;
        }
        .progress {
            height: 6px;
            border-radius: 3px;
            background-color: #e9ecef;
            overflow: hidden;
            margin-top: 30px;
        }
        .progress-bar {
            background: linear-gradient(90deg, #198754, #20c997);
            width: 0%;
            transition: width 7s linear;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <div class="icon-box">
            <i class="fa-solid fa-rocket"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Selamat Datang, {{ nama }}!</h3>
        <p class="text-primary fw-semibold small mb-3">Siap untuk hari yang sangat produktif?</p>
        
        <p class="text-secondary small fst-italic px-10 mb-0" style="line-height: 1.6;">
            "Keberhasilan proyek besar dibangun dari kedisiplinan harian, pencatatan anggaran yang akurat, dan kolaborasi tim yang solid. Mari wujudkan efisiensi dan kesuksesan bersama MANPRO."
        </p>
        
        <div class="progress">
            <div id="welcomeProgress" class="progress-bar"></div>
        </div>
        <p class="text-muted small mt-2 mb-0" style="font-size: 0.75rem;">Menuju Dashboard Utama...</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('welcomeProgress').style.width = '100%';
            }, 100);

            // Redirect to dashboard after 7 seconds
            setTimeout(() => {
                window.location.href = "{{ url_for('dashboard') }}";
            }, 7000);
        });
    </script>
</body>
</html>
