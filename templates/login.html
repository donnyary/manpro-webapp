<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MANPRO Software Manajemen Proyek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Menggunakan logo sebagai background halaman penuh */
        .login-bg {
            background: url("{{ url_for('static', filename='uploads/logo_manpro.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* Overlay transparan gelap agar teks & form kontras dengan background */
        .login-bg::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(2px);
        }
        /* Kartu Login dengan efek Glassmorphism */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            padding: 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .brand-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }
        .welcome-box {
            background: #066fd8;
            border-left: 4px solid #012150;
            font-size: 0.85rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-bg">
        <div class="login-card">
           <!-- Bagian Header Form Login -->
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='logo.jpg') }}" alt="MANPRO Logo" style="max-height: 200px; width: auto; object-fit: contain;" class="mb-3">
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'danger' or category == 'warning' else 'success' }} alert-dismissible fade show py-2 small rounded-3 mb-3 shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close btn-sm py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Form Input Username & Password -->
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label for="username" class="form-label small fw-bold text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control bg-light border-start-0 ps-0" id="username" name="username" placeholder="Masukkan username Anda..." required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="Masukkan password Anda..." required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="py-2.5 btn btn-primary fw-bold shadow-sm rounded-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Masuk ke Dashboard
                    </button>
                </div>

                <div class="text-center">
                    <p class="small text-muted mb-0">Belum punya akun? <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold text-primary">Daftar di sini</a></p>
                </div>
            </form>
            
            <!-- Footer Copyright -->
            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted" style="font-size: 0.75rem;">Software by Donny Aryanto &copy; 2026</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
